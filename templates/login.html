<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ExpenseIQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo"><i class="bi bi-wallet2 text-white"></i></div>
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your ExpenseIQ account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-msg alert-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope"></i> Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="bi bi-lock"></i> Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary w-100" style="padding:12px;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <p style="text-align:center; margin-top:24px; color: var(--muted); font-size:0.88rem;">
      Don't have an account?
      <a href="/register" style="color: var(--accent2); font-weight:600; text-decoration:none;">Create one</a>
    </p>
  </div>
</div>
</body>
</html>
