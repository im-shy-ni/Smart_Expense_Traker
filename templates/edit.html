<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Transaction — ExpenseIQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><i class="bi bi-wallet2 text-white"></i></div>
      <div>
        <div class="brand-name">ExpenseIQ</div>
        <div class="brand-sub">Smart Tracker</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a href="/monthly-report" class="nav-item"><i class="bi bi-bar-chart-fill"></i> Monthly Report</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-info">
        <div class="user-avatar">{{ session['user_name'][0].upper() }}</div>
        <div>
          <div class="user-name">{{ session['user_name'] }}</div>
          <div class="user-role">Member</div>
        </div>
      </div>
      <a href="/logout" class="btn btn-secondary w-100 btn-sm">
        <i class="bi bi-box-arrow-right"></i> Sign Out
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title"><i class="bi bi-pencil-square" style="color:var(--accent2);"></i> Edit Transaction</h1>
      <p class="page-sub">Update transaction details below</p>
    </div>

    <div class="panel" style="max-width: 540px;">
      <div class="panel-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ transaction[1] }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number" step="0.01" name="amount" class="form-control" value="{{ transaction[2] }}" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Type</label>
            <select name="type" class="form-select">
              <option value="income" {% if transaction[3] == 'income' %}selected{% endif %}>Income</option>
              <option value="expense" {% if transaction[3] == 'expense' %}selected{% endif %}>Expense</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary flex-fill">
              <i class="bi bi-check-lg"></i> Update Transaction
            </button>
            <a href="/" class="btn btn-secondary">
              <i class="bi bi-x-lg"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

</body>
</html>
